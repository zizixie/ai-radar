<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="每日 AI 与科技动态剪报" />
  <title>AI Radar · 每日情报站</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");
    :root { --paper:#f8f7f2; --ink:#252824; --muted:#6e746d; --line:#dcded6; --card:#fff; --accent:#246a61; --accent-soft:#e5f0ec; --warm:#e87d4b; --quiet:#f0f0eb; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:"Noto Sans SC",system-ui,sans-serif; }
    .wrap { width:min(1180px,calc(100% - 40px)); margin:0 auto; } header { padding:48px 0 0; border-bottom:1px solid var(--line); }
    .eyebrow,.meta,.source,.filter,.tab { font:500 11px/1.2 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .eyebrow { color:var(--accent); } h1 { margin:12px 0 8px; font:600 clamp(38px,6vw,67px)/.98 "Playfair Display","Noto Sans SC",serif; letter-spacing:-.04em; }
    .intro { margin:0; color:var(--muted); font-size:15px; } .radar-strip { display:flex; gap:14px; align-items:center; margin:28px 0 22px; padding:13px 15px; background:var(--accent-soft); border-left:3px solid var(--accent); color:#31554e; font-size:13px; }
    .radar-dot { width:9px; height:9px; flex:0 0 auto; border-radius:50%; background:var(--warm); box-shadow:0 0 0 4px rgba(232,125,75,.16); }
    .filters { display:flex; gap:5px; overflow-x:auto; padding:0 0 14px; scrollbar-width:none; } .filters::-webkit-scrollbar { display:none; }
    .filter,.tab { flex:0 0 auto; border:1px solid transparent; padding:8px 10px; color:var(--muted); background:transparent; cursor:pointer; }
    .filter:hover,.tab:hover { color:var(--ink); } .filter[aria-pressed="true"] { color:var(--paper); background:var(--ink); border-color:var(--ink); }
    main { padding:34px 0 70px; } .section { margin-bottom:52px; } .section-head { display:flex; align-items:end; justify-content:space-between; gap:16px; padding-bottom:12px; border-bottom:2px solid var(--ink); }
    h2 { margin:0; font-size:21px; letter-spacing:-.035em; } .section-note { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .cards { display:grid; gap:12px; margin-top:14px; } .today-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } .two-up,.discussions { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .card { display:block; min-width:0; padding:18px; color:inherit; background:var(--card); border:1px solid var(--line); text-decoration:none; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    .card:hover { transform:translateY(-2px); border-color:#9bb6b0; box-shadow:0 8px 20px rgba(37,40,36,.06); } .card:focus-visible { outline:3px solid var(--warm); outline-offset:3px; }
    .card-top,.card-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; } .source { color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .meta { color:var(--muted); white-space:nowrap; }
    h3 { margin:12px 0 7px; font-size:16px; line-height:1.4; letter-spacing:-.015em; } .description { display:-webkit-box; overflow:hidden; margin:0; color:var(--muted); font-size:13px; line-height:1.65; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .card-foot { margin-top:14px; padding-top:10px; border-top:1px solid var(--quiet); color:var(--muted); font:11px "DM Mono",monospace; } .today-card { padding:17px; } .today-card h3 { font-size:15px; } .today-card .description { -webkit-line-clamp:3; }
    .official-tabs { display:flex; gap:4px; margin:14px 0 -2px; } .tab { border-bottom:2px solid transparent; padding:8px 0; margin-right:18px; } .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
    .stream-label { margin:22px 0 -2px; color:var(--accent); font:500 11px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .empty { padding:25px 0; color:var(--muted); font-size:14px; } .loading { padding:70px 0; color:var(--muted); text-align:center; }
    .all-link { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:10px 0; border:0; border-bottom:1px solid var(--ink); color:var(--ink); background:transparent; font:500 12px "DM Mono",monospace; cursor:pointer; }
    .all-link:hover,.all-link:focus-visible { color:var(--accent); border-color:var(--accent); } .mode-note { margin:0 0 28px; color:var(--muted); font-size:13px; }
    footer { padding:20px 0 38px; border-top:1px solid var(--line); color:var(--muted); font:11px "DM Mono",monospace; letter-spacing:.04em; }
    @media (max-width:960px) { .today-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:620px) { .wrap { width:min(100% - 28px,620px); } header { padding-top:32px; } .radar-strip { margin-top:24px; } main { padding-top:28px; } .section { margin-bottom:38px; } .today-grid,.two-up,.discussions { grid-template-columns:1fr; } .section-note { display:none; } .card { padding:16px; } .today-card .description { -webkit-line-clamp:2; } }
    @media (prefers-reduced-motion:reduce) { .card { transition:none; } .card:hover { transform:none; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <div class="eyebrow">Personal AI Briefing / Daily</div>
    <h1>AI Radar</h1>
    <p class="intro">每天一页，先看到今天最值得点开的 AI 动态。</p>
    <div class="radar-strip"><span class="radar-dot" aria-hidden="true"></span><span id="updated">正在读取最新情报…</span></div>
    <nav class="filters" aria-label="资讯筛选">
      <button class="filter" data-filter="today" aria-pressed="true">今日</button>
      <button class="filter" data-filter="official" aria-pressed="false">官方</button>
      <button class="filter" data-filter="tools" aria-pressed="false">新工具</button>
      <button class="filter" data-filter="github" aria-pressed="false">GitHub</button>
      <button class="filter" data-filter="discussion" aria-pressed="false">热议</button>
    </nav>
  </div></header>
  <main class="wrap" id="app"><p class="loading">正在加载资讯…</p></main>
  <footer><div class="wrap">AI RADAR · 官方动态 · 新工具 · GitHub 热门 · 讨论热点 · 每日自动更新</div></footer>
  <script>
    const escapeHtml = (text = '') => String(text).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const formatTime = value => { if (!value) return '时间未标注'; const d = new Date(value); return Number.isNaN(d) ? value : new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d); };
    const parseTime = value => { const n = new Date(value).getTime(); return Number.isFinite(n) ? n : 0; };
    const names = { github_trending:'GitHub Trending', product_hunt:'Product Hunt', openai:'OpenAI', anthropic:'Anthropic', google_deepmind:'Google DeepMind', hacker_news:'Hacker News' };
    const officialKeys = ['openai','anthropic','google_deepmind'], toolKeys = ['product_hunt'];
    const state = { filter:'today', official:'openai', showAll:false, data:null };
    const importanceSignals = [
      { pattern:/\b(launch|release|announce|update|acquisition|funding|partnership)\b|发布|推出|宣布|更新|收购|融资|合作/i, points:6 },
      { pattern:/\b(new model|new feature|open source|api|agent|benchmark|gpt|claude|gemini)\b|新模型|新功能|开源|智能体|基准测试/i, points:5 },
      { pattern:/\b(product|tool|security|research|study)\b|产品|工具|安全|研究|行业/i, points:3 }
    ];
    const lowValueSignal = /\b(academic|thesis|survey|dataset)\b|学术|论文|数据集|课程作业/i;
    const userValueSignals = /\b(api|agent|coding|workflow|tool|product|open source|gpt|claude|gemini)\b|API|智能体|编程|工作流|工具|产品|开源|大模型/i;
    const sourceImportance = { openai:18, anthropic:18, google_deepmind:18, product_hunt:14, github_trending:14, hacker_news:10 };

    function normalize(data) {
      const seen = new Set();
      return Object.entries(names).flatMap(([key,name]) => (data[key] || []).map(entry => Object.assign({},entry,{source:entry.source || name,key:key}))).filter(entry => {
        const identity = entry.url || entry.title;
        if (!identity || seen.has(identity)) return false;
        seen.add(identity);
        return true;
      });
    }
    function card(entry, variant) {
      let meta = formatTime(entry.published_at);
      if (entry.key === 'github_trending') meta = '今日 +' + (entry.today_stars || 0) + ' stars';
      if (entry.key === 'hacker_news') meta = (entry.score || 0) + ' points · ' + (entry.comments || 0) + ' comments';
      const title = entry.title_zh || entry.title || '未命名资讯';
      const description = entry.summary_zh || entry.summary || entry.description || '暂无简介';
      return '<a class="card ' + (variant || '') + '" href="' + escapeHtml(entry.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="card-top"><span class="source">' + escapeHtml(entry.source) + '</span><span class="meta">' + escapeHtml(meta) + '</span></div>' +
        '<h3>' + escapeHtml(title) + '</h3><p class="description">' + escapeHtml(description) + '</p>' +
        '<div class="card-foot"><span>查看原文</span><span aria-hidden="true">↗</span></div></a>';
    }
    function cards(entries, className, variant) { return entries.length ? '<div class="cards ' + className + '">' + entries.map(entry => card(entry,variant)).join('') + '</div>' : '<p class="empty">暂时没有符合这一筛选的资讯。</p>'; }
    function section(title,note,content,id) { return '<section class="section ' + (id || '') + '"><div class="section-head"><div><h2>' + title + '</h2><span class="section-note">' + note + '</span></div></div>' + content + '</section>'; }
    function recentFirst(entries) {
      return entries.slice().sort((a,b) => parseTime(b.published_at)-parseTime(a.published_at) || (b.score || 0)-(a.score || 0) || (b.today_stars || 0)-(a.today_stars || 0));
    }
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    function withinHours(entry, now, hours) {
      if (entry.key === 'github_trending') {
        // Trending 没有发布时间；fetched_at 只用于判断数据是否仍在本次窗口内，绝不计入新鲜度得分。
        const fetchedAt = parseTime(entry.fetched_at);
        if (!fetchedAt) return true;
        const age = (now - fetchedAt) / 3600000;
        return age >= -2 && age <= hours;
      }
      const timestamp = parseTime(entry.published_at);
      if (!timestamp) return false;
      const age = (now - timestamp) / 3600000;
      return age >= -2 && age <= hours;
    }
    function entryText(entry) { return [entry.title_zh,entry.title,entry.summary_zh,entry.summary,entry.description].filter(Boolean).join(' '); }
    function freshnessScore(entry, now) {
      if (entry.key === 'github_trending') return 0;
      const timestamp = parseTime(entry.published_at);
      if (!timestamp) return 0;
      const age = Math.max(0, (now - timestamp) / 3600000);
      return Math.round(35 * clamp(1 - age / 48, 0, 1));
    }
    function importanceScore(entry) {
      let score = sourceImportance[entry.key] || 8;
      const text = entryText(entry);
      importanceSignals.forEach(signal => { if (signal.pattern.test(text)) score += signal.points; });
      if (lowValueSignal.test(text)) score -= 6;
      return clamp(score, 0, 30);
    }
    function heatScore(entry) {
      const stars = Number(entry.today_stars) || 0;
      const points = Number(entry.score) || 0;
      const comments = Number(entry.comments) || 0;
      const votes = Number(entry.votes || entry.upvotes) || 0;
      if (entry.key === 'github_trending') return Math.min(20, Math.round(Math.log1p(stars) * 4));
      if (entry.key === 'hacker_news') return Math.min(20, Math.round(Math.log1p(points) * 3 + Math.log1p(comments) * 2));
      if (entry.key === 'product_hunt') return Math.min(20, Math.round(Math.log1p(votes) * 4));
      return 0;
    }
    function userValueScore(entry) {
      let score = { product_hunt:12, github_trending:12, hacker_news:9, openai:10, anthropic:10, google_deepmind:10 }[entry.key] || 8;
      const text = entryText(entry);
      if (userValueSignals.test(text)) score += 3;
      if (lowValueSignal.test(text)) score -= 4;
      return clamp(score, 0, 15);
    }
    function scoreEntry(entry, now) {
      // 今日精选总分 100：新鲜度 35 + 重要性 30 + 热度 20 + 用户价值 15。
      return freshnessScore(entry, now) + importanceScore(entry) + heatScore(entry) + userValueScore(entry);
    }
    function titleTokens(entry) {
      const title = [entry.title_zh,entry.title].filter(Boolean).join(' ');
      return new Set(title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, ' ').split(/\s+/).filter(token => token.length > 2));
    }
    function similarTitle(first, second) {
      const firstTitle = [first.title_zh,first.title].filter(Boolean).join(' ').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
      const secondTitle = [second.title_zh,second.title].filter(Boolean).join(' ').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
      if (firstTitle.length >= 8 && secondTitle.length >= 8 && (firstTitle.includes(secondTitle) || secondTitle.includes(firstTitle))) return true;
      const a = titleTokens(first), b = titleTokens(second);
      if (!a.size || !b.size) return false;
      const same = [...a].filter(token => b.has(token)).length;
      return same >= 3 && same / Math.min(a.size, b.size) >= .72;
    }
    function dedupeToday(entries) {
      const seenUrls = new Set(), kept = [];
      entries.forEach(entry => {
        if (seenUrls.has(entry.url) || kept.some(existing => similarTitle(existing, entry))) return;
        seenUrls.add(entry.url);
        kept.push(entry);
      });
      return kept;
    }
    function selectDiverse(entries) {
      const selected = [], counts = {};
      entries.forEach(entry => {
        if (selected.length >= 5 || counts[entry.key]) return;
        selected.push(entry);
        counts[entry.key] = 1;
      });
      entries.forEach(entry => {
        if (selected.length >= 5 || selected.includes(entry) || (counts[entry.key] || 0) >= 2) return;
        selected.push(entry);
        counts[entry.key] = (counts[entry.key] || 0) + 1;
      });
      entries.forEach(entry => {
        if (selected.length >= 5 || selected.includes(entry)) return;
        selected.push(entry);
        counts[entry.key] = (counts[entry.key] || 0) + 1;
      });
      return selected.sort((a,b) => b._radarScore - a._radarScore);
    }
    function compareRank(a, b) {
      if (b._radarScore !== a._radarScore) return b._radarScore - a._radarScore;
      if (a.key === 'github_trending' || b.key === 'github_trending') return (b.today_stars || 0) - (a.today_stars || 0);
      return parseTime(b.published_at) - parseTime(a.published_at);
    }
    function rankEntries(entries, now) {
      return entries.map(entry => Object.assign({},entry,{_radarScore:scoreEntry(entry,now)})).sort(compareRank);
    }
    function today(all) {
      const now = Date.now(), recent24 = rankEntries(all.filter(entry => withinHours(entry, now, 24)), now);
      const recentQuality = dedupeToday(recent24).filter(entry => entry._radarScore >= 28);
      const ranked = recentQuality.length >= 5 ? recent24 : rankEntries(all.filter(entry => withinHours(entry, now, 48)), now);
      const quality = dedupeToday(ranked).filter(entry => entry._radarScore >= 28);
      const picks = selectDiverse(quality);
      return section('如果今天只看 5 条 AI 信息','从今天的 AI 动态里，挑出真正值得你点开的 5 条。',cards(picks,'today-grid','today-card'),'today-section') +
        '<button class="all-link" data-action="all">查看全部情报 <span aria-hidden="true">↗</span></button>';
    }
    function official(all, includeAll) {
      if (includeAll) {
        const body = officialKeys.map(key => '<div><div class="stream-label">' + names[key] + '</div>' + cards(recentFirst(all.filter(entry => entry.key === key)),'two-up','') + '</div>').join('');
        return section('官方动态','模型、产品与研究团队的一手更新',body,'official-section');
      }
      const current = recentFirst(all.filter(entry => entry.key === state.official));
      const tabs = officialKeys.map(key => '<button class="tab" data-official="' + key + '" aria-selected="' + (key === state.official) + '">' + names[key] + '</button>').join('');
      return section('官方动态','模型、产品与研究团队的一手更新','<div class="official-tabs" role="tablist">' + tabs + '</div>' + cards(current,'two-up',''),'official-section');
    }
    function tools(all) {
      const product = recentFirst(all.filter(entry => toolKeys.includes(entry.key)));
      return section('新工具','最近出现的新 AI 产品与工具',cards(product,'two-up',''),'tools-section');
    }
    function github(all) {
      const entries = recentFirst(all.filter(entry => entry.key === 'github_trending'));
      return section('GitHub 热门项目','今天正在获得关注的开源项目',cards(entries,'two-up',''),'github-section');
    }
    function discussion(all) {
      const entries = all.filter(entry => entry.key === 'hacker_news').sort((a,b) => (b.score || 0)-(a.score || 0));
      return section('大家在讨论什么','Hacker News · 按 points 排列',cards(entries,'discussions',''),'discussion-section');
    }
    function render() {
      const all = normalize(state.data), app = document.querySelector('#app');
      if (state.showAll) app.innerHTML = '<p class="mode-note">完整情报流 · 可通过顶部导航回到单一分类</p>' + official(all,true) + tools(all) + github(all) + discussion(all);
      else if (state.filter === 'today') app.innerHTML = today(all);
      else if (state.filter === 'official') app.innerHTML = official(all);
      else if (state.filter === 'tools') app.innerHTML = tools(all);
      else if (state.filter === 'github') app.innerHTML = github(all);
      else app.innerHTML = discussion(all);
      document.querySelectorAll('.filter').forEach(button => button.setAttribute('aria-pressed',String(!state.showAll && button.dataset.filter === state.filter)));
    }
    async function init() {
      try {
        const response = await fetch('./data/news.json',{cache:'no-store'});
        if (!response.ok) throw new Error('读取数据失败');
        state.data = await response.json();
        document.querySelector('#updated').textContent = state.data.updated_at ? '最后更新：' + formatTime(state.data.updated_at) : '等待首次自动更新';
        render();
      } catch (error) {
        document.querySelector('#app').innerHTML = '<p class="loading">资讯加载失败，请通过网站地址或本地服务器打开页面后重试。</p>';
        document.querySelector('#updated').textContent = '暂时无法读取数据';
      }
    }
    document.addEventListener('click', event => {
      const filter = event.target.closest('[data-filter]'), officialTab = event.target.closest('[data-official]'), action = event.target.closest('[data-action]');
      if (filter && state.data) { state.filter = filter.dataset.filter; state.showAll = false; render(); }
      if (officialTab && state.data) { state.official = officialTab.dataset.official; render(); }
      if (action && state.data) { state.showAll = action.dataset.action === 'all'; state.filter = 'today'; render(); }
    });
    init();
  </script>
</body>
</html>
